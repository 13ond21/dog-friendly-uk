<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6f43">
  <title>Dog-Friendly Spots UK &amp; Ireland</title>
  <meta name="description" content="Dog-friendly pubs, beaches, walking trails and dog parks across the UK and Ireland.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" id="canonical" href="listing.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dog-Friendly Spots UK &amp; Ireland">
  <meta property="og:title" content="Dog-Friendly Spots UK &amp; Ireland">
  <meta property="og:description" content="Dog-friendly pubs, beaches, walking trails and dog parks across the UK and Ireland.">
  <meta property="og:url" id="ogurl" content="listing.html">
  <meta property="og:image" content="https://13ond21.github.io/dog-friendly-uk/og-image.png">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://nimmzmvulwhbajnxgagl.supabase.co">
  <link rel="dns-prefetch" href="https://nimmzmvulwhbajnxgagl.supabase.co">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --green: #1f6f43; --green-dark: #16512f; --amber: #b7791f; --blue: #1f6fb7;
      --ink: #1c2b24; --muted: #5b6b62; --bg: #f6f8f6; --card: #ffffff;
      --border: #e3e9e4; --radius: 12px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .loading { text-align: center; padding: 40px 0; color: var(--muted); }
    .spinner {
      display: inline-block; width: 30px; height: 30px;
      border: 3px solid var(--border); border-top-color: var(--green);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.55;
    }
    a { color: var(--green); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    .site-header {
      background: linear-gradient(135deg, var(--green) 0%, #2d8a5a 100%);
      color: #fff; padding: 26px 0;
    }
    .site-header h1 { margin: 0; font-size: 1.3rem; }
    .site-header a { color: #fff; text-decoration: none; }
    main { padding: 28px 0 60px; }
    .back { font-size: .9rem; margin-bottom: 16px; display: inline-block; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 26px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card-top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .badge {
      font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      padding: 3px 9px; border-radius: 999px; color: #fff; white-space: nowrap;
    }
    .badge.pub { background: var(--amber); }
    .badge.beach { background: var(--blue); }
    .badge.trail { background: var(--green); }
    .badge.dog_park { background: #7a3fb5; }
    .badge.toilet { background: #0f766e; }
    .badge.accommodation { background: #4338ca; }
    .badge.featured { background: #141b16; }
    h2.title { margin: 0 0 4px; font-size: 1.7rem; line-height: 1.25; }
    .meta { color: var(--muted); font-size: .95rem; margin: 6px 0; }
    .desc { font-size: 1.05rem; margin: 14px 0; }
    .facilities { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .facility {
      font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    }
    .specs { margin: 18px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); padding: 6px 16px; }
    .specs h3 { margin: 12px 0 4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .spec-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: .95rem; }
    .spec-row:last-child { border-bottom: 0; }
    .spec-label { flex: 0 0 120px; color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
    .spec-value { color: var(--ink); }
    .spec-value a { color: var(--green); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .btn {
      display: inline-block; padding: 9px 14px; border-radius: 8px; font-size: .88rem;
      font-weight: 600; text-decoration: none; border: 1px solid var(--border);
      background: #fff; color: var(--ink);
    }
    .btn:hover { border-color: var(--green); }
    .btn-primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }
    .notice, .error {
      background: #fff; border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 30px; text-align: center; color: var(--muted);
    }
    .site-footer { background: #0f241a; color: #cfe3d6; padding: 26px 0 36px; font-size: .9rem; }
    .site-footer a { color: #9fd4b4; }
    @media (max-width: 640px) { h2.title { font-size: 1.35rem; } }

    /* "Book this stay" — affiliate booking panel on accommodation listings */
    .book-box {
      margin: 18px 0; padding: 18px; border-radius: 12px;
      background: linear-gradient(135deg, #eef7f1 0%, #ffffff 65%);
      border: 1px solid #cfe3d6;
    }
    .book-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
    .book-head strong { font-size: 1.05rem; }
    .book-head span { font-size: .78rem; color: var(--muted); }
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .book-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 12px; border-radius: 8px; font-size: .88rem; font-weight: 600;
      text-decoration: none; border: 1px solid var(--border); background: #fff; color: var(--ink);
      transition: border-color .15s ease, transform .15s ease, background .15s ease;
    }
    .book-btn:hover { border-color: var(--green); transform: translateY(-1px); }
    .book-btn.primary {
      background: var(--green); border-color: var(--green); color: #fff;
      grid-column: 1 / -1; font-size: 1rem; padding: 13px 14px;
    }
    .book-btn.primary:hover { background: var(--green-dark); }
    .report-link { margin-top: 16px; font-size: .85rem; color: var(--muted); }
    .report-link a { color: var(--green); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1><a href="index.html">🐾 Dog-Friendly Spots UK &amp; Ireland</a></h1>
    </div>
  </header>

  <main class="wrap" id="main" tabindex="-1">
    <a class="back" href="index.html">← Back to all listings</a>
    <div class="loading" id="loading"><span class="spinner" aria-hidden="true"></span><p>Loading…</p></div>
    <div id="listing"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Part of <a href="index.html">Dog-Friendly Spots UK &amp; Ireland</a> — a free directory of
         dog-friendly pubs, beaches, trails, dog parks and toilets.</p>
      <!-- TODO: replace your@email.com with your real inbox before going live -->
      <p><a href="mailto:your@email.com?subject=Dog-Friendly%20Spots%20%E2%80%94%20suggest%20a%20listing">✉️ Suggest a listing</a></p>
    </div>
  </footer>
  <script>
    /* ============================================================
       CONFIG — keep in sync with index.html.
       Supabase Dashboard -> your project -> Settings -> API.
       ============================================================ */
    const SUPABASE_URL = "https://nimmzmvulwhbajnxgagl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__2wVD38i889qSDDNUYejNw_c6MKp0Ww";
    const DIRECTORY_SLUG = "dog-friendly-uk";

    /* ============================================================
       AFFILIATE — "Book this stay" buttons on accommodation pages.
       The links work right now as plain hotel searches; add your
       partner IDs below to earn commission when visitors book.
       ------------------------------------------------------------
       Booking.com (the "#1" button):
         Sign up free at https://www.booking.com/affiliate-programme-v2.html
         and paste your numeric partner id into bookingAid below.
       Hotels.com / Expedia:
         Apply via the Expedia affiliate network (Impact / CJ), then
         enable the flags and add your tracking link template.
       Airbnb: invite-only partner programme — https://www.airbnb.com/d/partner
       Google Hotels: plain search link, no commission, always useful.
       ============================================================ */
    const AFFILIATE = {
      bookingAid: "",                    // Booking.com partner id, e.g. "1234567"
      bookingLabel: "dog-friendly-uk",   // your tracking source name
      showHotelsDotCom: true,
      showExpedia: false,
      showAirbnb: true,
      showGoogleHotels: true
    };

    const CATEGORY_LABELS = { pub: "Pub", beach: "Beach", trail: "Trail", dog_park: "Dog Park", toilet: "Toilets", accommodation: "Accommodation" };
    const CATEGORY_ICONS = { pub: "🍺", beach: "🏖️", trail: "🥾", dog_park: "🌳", toilet: "🚽", accommodation: "🏨" };
    const REGION_LABEL = { pub: "pub", beach: "beach", trail: "trail", dog_park: "dog park", toilet: "public toilets", accommodation: "accommodation" };

    function slugify(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }
    function listingSlug(item) {
      return slugify(item.name) + "-" + slugify(item.region);
    }
    function esc(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function mapsQuery(item) {
      return [item.name, item.town, item.region].filter(Boolean).join(", ");
    }
    function placeQuery(item) {
      if (item.latitude != null && item.longitude != null) return item.latitude + "," + item.longitude;
      return mapsQuery(item);
    }

    /* Hotel-search text used to build the booking links. */
    function bookingQuery(item) {
      return [item.name, item.town, item.region].filter(Boolean).join(", ");
    }

    /* Booking links for a listing. Booking.com is always first and is
       rendered as the primary button ("make the number 1"). */
    function bookingLinks(item) {
      const q = encodeURIComponent(bookingQuery(item));
      const links = [];
      links.push({
        label: "Book on Booking.com ↗",
        url: "https://www.booking.com/searchresults.html?ss=" + q +
          (AFFILIATE.bookingAid
            ? "&aid=" + encodeURIComponent(AFFILIATE.bookingAid) +
              "&label=" + encodeURIComponent(AFFILIATE.bookingLabel)
            : ""),
        primary: true
      });
      if (AFFILIATE.showHotelsDotCom) {
        links.push({ label: "Hotels.com", url: "https://www.hotels.com/search.do?destination=" + q });
      }
      if (AFFILIATE.showExpedia) {
        links.push({ label: "Expedia", url: "https://www.expedia.co.uk/Hotel-Search?destination=" + q });
      }
      if (AFFILIATE.showAirbnb) {
        const s = encodeURIComponent(bookingQuery(item).replace(/\s+/g, "-"));
        links.push({ label: "Airbnb", url: "https://www.airbnb.co.uk/s/" + s + "/homes" });
      }
      if (AFFILIATE.showGoogleHotels) {
        links.push({ label: "Google Hotels", url: "https://www.google.com/travel/hotels?q=" + q });
      }
      return links;
    }

    function bookBoxHTML(item) {
      const rel = "sponsored noopener noreferrer";
      const btns = bookingLinks(item).map((l) =>
        `<a class="book-btn${l.primary ? " primary" : ""}" href="${esc(l.url)}" target="_blank" rel="${rel}">${esc(l.label)}</a>`
      ).join("");
      return `
        <div class="book-box">
          <div class="book-head"><strong>🛏️ Book this stay</strong><span>We may earn a small commission at no extra cost to you.</span></div>
          <div class="book-grid">${btns}</div>
        </div>`;
    }

    function setMeta(title, description, url) {
      document.title = title;
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute("content", description);
      const ogt = document.querySelector('meta[property="og:title"]');
      if (ogt) ogt.setAttribute("content", title);
      const ogd = document.querySelector('meta[property="og:description"]');
      if (ogd) ogd.setAttribute("content", description);
      const ogu = document.getElementById("ogurl");
      if (ogu) ogu.setAttribute("content", url);
      const can = document.getElementById("canonical");
      if (can) can.setAttribute("href", url);
    }

    function injectJSONLD(item) {
      const script = document.createElement("script");
      script.type = "application/ld+json";
      script.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Place",
        "name": item.name,
        "description": item.description,
        "url": location.href.split("#")[0],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": item.town || undefined,
          "postalCode": item.postcode || undefined,
          "addressRegion": item.region,
          "addressCountry": item.region === "Dublin" ? "IE" : "GB"
        },
        "geo": (item.latitude != null && item.longitude != null)
          ? { "@type": "GeoCoordinates", "latitude": item.latitude, "longitude": item.longitude } : undefined
      });
      document.head.appendChild(script);
    }
    function cardHTML(item) {
      const label = CATEGORY_LABELS[item.category] || item.category;
      const location = [item.town, item.region, item.postcode].filter(Boolean).join(" · ");
      const q = encodeURIComponent(placeQuery(item));
      const nearestLoos = encodeURIComponent("public toilets near " + mapsQuery(item));
      const website = item.website
        ? `<a class="btn ${item.category === "accommodation" ? "" : "btn-primary"}" href="${esc(item.website)}" target="_blank" rel="noopener noreferrer">Visit website ↗</a>` : "";
      const bookBox = item.category === "accommodation" ? bookBoxHTML(item) : "";
      const report = `<p class="report-link">Spot something wrong or out of date? <a href="mailto:your@email.com?subject=${encodeURIComponent("Report a problem — " + item.name)}">Let us know</a>.</p>`;

      const specs = [];
      specs.push(`<div class="spec-row"><span class="spec-label">Location</span><span class="spec-value">📍 ${esc(location)}</span></div>`);
      if (item.opening_hours) {
        specs.push(`<div class="spec-row"><span class="spec-label">Opening hours</span><span class="spec-value">🕒 ${esc(item.opening_hours)}</span></div>`);
      }
      if (item.phone) {
        specs.push(`<div class="spec-row"><span class="spec-label">Phone</span><span class="spec-value">📞 <a href="tel:${esc(String(item.phone).replace(/\s+/g, ""))}">${esc(item.phone)}</a></span></div>`);
      }
      if (item.category === "toilet" && (item.wheelchair_accessible || item.baby_change)) {
        const chips = `${item.wheelchair_accessible ? '<span class="facility">♿ Accessible</span>' : ""}${item.baby_change ? '<span class="facility">🍼 Baby change</span>' : ""}`;
        specs.push(`<div class="spec-row"><span class="spec-label">Facilities</span><span class="spec-value facilities">${chips}</span></div>`);
      }
      const specBlock = `<div class="specs"><h3>Details</h3>${specs.join("")}</div>`;

      return `
        <article class="card">
          <div class="card-top">
            <span class="badge ${esc(item.category)}">${CATEGORY_ICONS[item.category] || ""} ${esc(label)}</span>
            ${item.is_featured ? '<span class="badge featured">Featured</span>' : ""}
          </div>
          <h2 class="title">${esc(item.name)}</h2>
          <p class="desc">${esc(item.description)}</p>
          ${bookBox}
          ${specBlock}
          <div class="actions">
            ${website}
            <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=${q}" target="_blank" rel="noopener noreferrer">Google Maps</a>
            <a class="btn" href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener noreferrer">Apple Maps</a>
            <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=${nearestLoos}" target="_blank" rel="noopener noreferrer">🚽 Nearest toilets</a>
          </div>
          ${report}
        </article>`;
    }

    async function init() {
      const params = new URLSearchParams(location.search);
      const slug = (params.get("slug") || "").toLowerCase();
      const el = document.getElementById("listing");

      if (!slug) {
        el.innerHTML = '<div class="notice">No listing specified. <a href="index.html">Browse all listings</a>.</div>';
        return;
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await supabase
          .from("listings")
          .select("name, category, region, town, postcode, description, website, is_featured, opening_hours, phone, popularity, wheelchair_accessible, baby_change, latitude, longitude")
          .eq("directory_slug", DIRECTORY_SLUG);
        if (error) throw error;

        const items = data || [];
        const item = items.find((i) => listingSlug(i) === slug);

        if (!item) {
          el.innerHTML = '<div class="error"><strong>Listing not found.</strong><br><a href="index.html">Back to all listings</a></div>';
          return;
        }

        const label = CATEGORY_LABELS[item.category] || item.category;
        const regionNoun = REGION_LABEL[item.category] || "place";
        const title = `${item.name} — ${label} in ${item.region} | Dog-Friendly Spots UK &amp; Ireland`;
        const description = `${item.description} ${item.name} is a dog-friendly ${regionNoun} in ${[item.town, item.region].filter(Boolean).join(", ")}.`;
        setMeta(title, description, location.href.split("#")[0]);
        injectJSONLD(item);
        el.innerHTML = cardHTML(item);
      } catch (err) {
        console.error("Failed to load listing:", err);
        el.innerHTML = '<div class="error"><strong>Couldn\'t load this listing.</strong><br><a href="index.html">Back to all listings</a></div>';
      } finally {
        document.getElementById("loading").hidden = true;
      }
    }

    init();
  </script>
</body>
</html>
